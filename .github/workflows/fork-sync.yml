name: Fork Sync

# Merges Yarden-zamir/t3code main into fork main every 3 hours. Yarden's fork merges
# pingdotgg/t3code, so upstream changes arrive through it. Main only moves
# forward: no rebase and no force-push, so checkouts and tags stay valid.
# A merge conflict (except one only in README.md), a failed typecheck or a failed fork test stops the sync,
# reports it in an issue and calls the repair agent. See docs/fork/operations.md "Fork Sync".

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      notify_agent:
        description: Call the agent webhook if this run fails. The agent sets false on its own retries.
        type: boolean
        default: true

concurrency:
  group: fork-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: Yarden-zamir/t3code
  ISSUE_TITLE: "Fork sync: upstream merge failed"

jobs:
  sync:
    name: Merge upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN cannot push commits that change .github/workflows, and
          # upstream changes them often. FORK_SYNC_TOKEN has the workflow scope.
          # Its push also starts the push workflows, which GITHUB_TOKEN pushes do not.
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - id: merge
        name: Merge upstream main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main already contains upstream main."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A conflict in README.md alone has a fixed rule: the fork section up to the first
          # `---` line stays on top, and the upstream README follows below it. Yarden's README
          # has its own fork section above its first `---` line, so that part is dropped.
          resolve_readme() {
            [[ "$(git diff --name-only --diff-filter=U)" == "README.md" ]] || return 1
            git cat-file -e :2:README.md && git cat-file -e :3:README.md || return 1
            local fork_end upstream_end
            fork_end="$(git show :2:README.md | grep -n -m1 -x -F -- '---' | cut -d: -f1)"
            upstream_end="$(git show :3:README.md | grep -n -m1 -x -F -- '---' | cut -d: -f1)"
            [[ -n "$fork_end" && -n "$upstream_end" ]] || return 1
            { git show :2:README.md | head -n "$fork_end"; git show :3:README.md | tail -n +"$((upstream_end + 1))"; } > README.md
            git add README.md
            git commit --no-edit --quiet
          }
          if ! git merge --no-edit -m "chore(sync): merge ${UPSTREAM_REPOSITORY} main" upstream/main > "$RUNNER_TEMP/merge.log" 2>&1; then
            if resolve_readme; then
              echo "::notice title=README.md conflict resolved::Kept the fork section above the first --- line and took the upstream README below it."
              echo "merged=true" >> "$GITHUB_OUTPUT"
              git log --oneline HEAD^1..HEAD^2 | head -50
              exit 0
            fi
            cat "$RUNNER_TEMP/merge.log"
            git status --short | grep -E '^(UU|AA|DU|UD|AU|UA|DD) ' >> "$RUNNER_TEMP/merge.log" || true
            git merge --abort
            echo "reason=merge conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "Upstream commits merged:"
          git log --oneline HEAD^1..HEAD^2 | head -50

      - if: steps.merge.outputs.merged == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - id: checks
        if: steps.merge.outputs.merged == 'true'
        name: Typecheck
        run: vp run typecheck

      # A merge without conflicts can still break a fork feature. The fork tests
      # are the test files that the fork changed since the last merged upstream
      # commit. Right after the merge, that commit is upstream main.
      - id: fork_tests
        if: steps.merge.outputs.merged == 'true'
        name: Fork tests
        run: |
          set -euo pipefail
          base="$(git merge-base upstream/main HEAD)"
          mapfile -t files < <(git diff --name-only --diff-filter=AMR "$base" HEAD -- '*.test.ts' '*.test.tsx' ':!apps/web')
          # apps/web tests run from apps/web: its config holds the unit and the browser project.
          mapfile -t web_files < <(git -C apps/web diff --relative --name-only --diff-filter=AMR "$base" HEAD -- '*.test.ts' '*.test.tsx')
          if (( ${#files[@]} + ${#web_files[@]} == 0 )); then
            echo "No fork test files."
            exit 0
          fi
          if (( ${#files[@]} > 0 )); then
            printf '%s\n' "${files[@]}"
            vp test run "${files[@]}"
          fi
          if (( ${#web_files[@]} > 0 )); then
            printf 'apps/web/%s\n' "${web_files[@]}"
            if printf '%s\n' "${web_files[@]}" | grep -q '\.browser\.test\.'; then
              node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
            fi
            (cd apps/web && vp test run --project unit --project browser "${web_files[@]}")
          fi

      # A fast-forward push. If main moved during the run, merge the new main
      # into the sync commit and push again. Main is never force-pushed.
      - name: Push to main
        if: steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during the run (attempt ${attempt}). Merging the new main."
            git fetch origin main
            git merge --no-edit -m "chore(sync): merge main" FETCH_HEAD
            vp run typecheck
          done
          echo "main kept moving; giving up after 3 attempts." >&2
          exit 1

      - name: Report failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.merge.outputs.reason || (steps.checks.outcome == 'failure' && 'typecheck failed') || (steps.fork_tests.outcome == 'failure' && 'fork tests failed') || 'workflow step failed' }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "Merge of ${UPSTREAM_REPOSITORY} main into fork main stopped: **${REASON}**."
            echo
            echo "Run: ${run_url}"
            if [[ -f "$RUNNER_TEMP/merge.log" ]]; then
              echo
              echo '```'
              tail -60 "$RUNNER_TEMP/merge.log"
              echo '```'
            fi
          } > "$RUNNER_TEMP/issue.md"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"${ISSUE_TITLE}\"" --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi

  # Upstream workflows need upstream's runners and secrets, so the fork disables them.
  # A sync can bring a new upstream workflow file, which starts active. This job fails
  # and prints the command that disables it. Fork workflow files start with "fork-".
  # Limit: a workflow that GitHub registers after this job runs shows up on the next sync.
  upstream_workflows:
    name: Check upstream workflows
    needs: [sync]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: List active upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh workflow list --repo "$GITHUB_REPOSITORY" --all --json path,state \
            --jq '.[] | select(.state == "active" and (.path | startswith(".github/workflows/"))
              and ((.path | ltrimstr(".github/workflows/")) | startswith("fork-") | not)) | .path')"
          if [[ -z "$active" ]]; then
            echo "Only fork workflows are active."
            exit 0
          fi
          echo "::error title=Active upstream workflows::Disable them, or rename a fork workflow to fork-*.yml."
          while IFS= read -r path; do
            echo "gh workflow disable --repo $GITHUB_REPOSITORY $(basename "$path")"
          done <<<"$active"
          exit 1

  # Starts a repair agent on a T3 server through a scheduled-task webhook.
  # Off until the T3_AGENT_WEBHOOK_URL secret is set.
  notify_agent:
    name: Notify repair agent
    needs: [sync, upstream_workflows]
    if: failure() && github.event.inputs.notify_agent != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/fork-notify-agent.sh
          sparse-checkout-cone-mode: false
      - name: Call agent webhook
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.T3_AGENT_WEBHOOK_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/fork-notify-agent.sh
