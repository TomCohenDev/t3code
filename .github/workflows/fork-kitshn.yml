# Fork: deploys the Android APK mirror (kitshn.config.ts) when its files change.
name: kitshn
on:
  push:
    branches: [main]
    paths: [kitshn.config.ts, scripts/apk-mirror/**, .github/workflows/fork-kitshn.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  kitshn:
    # The mirror serves Yarden's APKs on his domain; forks of this fork do not deploy it.
    if: github.repository == 'Yarden-zamir/t3code'
    uses: Yarden-zamir/kitshn/.github/workflows/kitshn2-deploy.yml@main
    secrets: inherit
